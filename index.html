<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KayKit Character Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #aaa;
        }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            min-width: 240px;
            max-height: 90vh;
            overflow-y: auto;
        }
        #controls h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #8af;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
        #controls select {
            width: 100%;
            padding: 5px;
            margin-bottom: 12px;
            background: #333;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
        }
        #controls select optgroup {
            background: #444;
            color: #8af;
            font-weight: bold;
            padding: 5px 0;
        }
        #controls select option {
            background: #333;
            color: #eee;
            padding: 3px 8px;
        }
        #controls label {
            display: block;
            margin-bottom: 3px;
            color: #aaa;
        }
        .slider-group {
            margin-bottom: 8px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 4px;
        }
        .slider-row span {
            width: 15px;
            color: #aaa;
        }
        .slider-row input[type="range"] {
            flex: 1;
        }
        .slider-row input[type="number"] {
            width: 55px;
            padding: 2px 4px;
            background: #333;
            color: #eee;
            border: 1px solid #555;
            border-radius: 3px;
        }
        .section {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h1>Knight</h1>
        <p>Drag to rotate | Scroll to zoom</p>
    </div>

    <div id="controls">
        <div class="section">
            <h3>Character</h3>
            <select id="character-select">
                <optgroup label="Adventurers">
                    <option value="Knight">Knight</option>
                    <option value="Barbarian">Barbarian</option>
                    <option value="Barbarian_Large">Barbarian (Large)</option>
                    <option value="Druid">Druid</option>
                    <option value="Engineer">Engineer</option>
                    <option value="Mage">Mage</option>
                    <option value="Ranger">Ranger</option>
                    <option value="Rogue">Rogue</option>
                    <option value="Rogue_Hooded">Rogue (Hooded)</option>
                </optgroup>
                <optgroup label="Skeletons">
                    <option value="Skeleton_Warrior">Skeleton Warrior</option>
                    <option value="Skeleton_Rogue">Skeleton Rogue</option>
                    <option value="Skeleton_Mage">Skeleton Mage</option>
                    <option value="Skeleton_Minion">Skeleton Minion</option>
                    <option value="Skeleton_Golem">Skeleton Golem</option>
                    <option value="Necromancer">Necromancer</option>
                </optgroup>
                <optgroup label="Mystery Monthly S4">
                    <option value="Orc_Raider">Orc Raider</option>
                    <option value="Driver">Driver</option>
                    <option value="Monster">Monster</option>
                    <option value="MonsterCostume">Monster Costume</option>
                    <option value="Werewolf_Man">Werewolf (Human)</option>
                    <option value="Werewolf_Wolf">Werewolf (Wolf)</option>
                    <option value="Animatronic">Animatronic</option>
                    <option value="Animatronic_Creepy">Animatronic (Creepy)</option>
                    <option value="ActionFigure">Action Figure</option>
                    <option value="SpaceRanger">Space Ranger</option>
                    <option value="SpaceRanger_Flight">Space Ranger (Flight)</option>
                    <option value="Ninja">Ninja</option>
                    <option value="Survivalist">Survivalist</option>
                    <option value="Paladin">Paladin</option>
                    <option value="Paladin_Helmet">Paladin (Helmet)</option>
                    <option value="Clown">Clown</option>
                    <option value="Robot_One">Robot One</option>
                    <option value="Robot_Two">Robot Two</option>
                </optgroup>
                <optgroup label="Mystery Monthly S5">
                    <option value="CombatMech">Combat Mech</option>
                    <option value="Superhero">Superhero</option>
                    <option value="BlackKnight">Black Knight</option>
                    <option value="Vampire">Vampire</option>
                    <option value="Witch">Witch</option>
                    <option value="Helper">Helper A</option>
                    <option value="Helper_B">Helper B</option>
                    <option value="FrostGolem">Frost Golem</option>
                    <option value="Caveman">Caveman</option>
                    <option value="Clanker">Clanker</option>
                    <option value="Protagonist">Protagonist A</option>
                    <option value="Protagonist_B">Protagonist B</option>
                    <option value="Hiker">Hiker</option>
                    <option value="Tiefling">Tiefling</option>
                </optgroup>
                <optgroup label="Mystery Monthly S6">
                    <option value="Lorekeeper">Lorekeeper</option>
                    <option value="OrcBrute">Orc Brute</option>
                    <option value="Cleric">Cleric</option>
                    <option value="Monstrosity">Monstrosity</option>
                    <option value="PlantWarrior">Plant Warrior</option>
                    <option value="ToySoldier">Toy Soldier</option>
                    <option value="4GTN">4GTN</option>
                    <option value="4GTN_Forgotten">4GTN (Forgotten)</option>
                    <option value="Hoarder">Hoarder</option>
                    <option value="AvianSwordsman">Avian Swordsman</option>
                    <option value="Marksman">Marksman</option>
                    <option value="MagicalGirl">Magical Girl</option>
                    <option value="Farmer">Farmer A</option>
                    <option value="Farmer_B">Farmer B</option>
                </optgroup>
            </select>
        </div>

        <div class="section">
            <h3>Skin</h3>
            <select id="skin-select">
                <option value="">Default</option>
                <option value="_alt_A">Alt A</option>
                <option value="_alt_B">Alt B</option>
                <option value="_alt_C">Alt C</option>
            </select>
        </div>

        <div class="section">
            <h3>Animation</h3>
            <select id="animation-select">
                <option value="">Loading...</option>
            </select>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <button id="anim-pause" style="flex: 1; padding: 5px; background: #444; color: #eee; border: 1px solid #666; border-radius: 4px; cursor: pointer;">Pause</button>
                <button id="anim-reset" style="flex: 1; padding: 5px; background: #444; color: #eee; border: 1px solid #666; border-radius: 4px; cursor: pointer;">Reset</button>
            </div>
        </div>

        <div class="section">
            <h3>Right Hand</h3>
            <select id="right-weapon-select">
                <option value="">(None)</option>
            </select>
            <label>Position</label>
            <div class="slider-group">
                <div class="slider-row"><span>X:</span><input type="range" id="right-pos-x" min="-0.5" max="0.5" step="0.01" value="0"><input type="number" id="right-pos-x-num" min="-0.5" max="0.5" step="0.01" value="0"></div>
                <div class="slider-row"><span>Y:</span><input type="range" id="right-pos-y" min="-0.5" max="0.5" step="0.01" value="0"><input type="number" id="right-pos-y-num" min="-0.5" max="0.5" step="0.01" value="0"></div>
                <div class="slider-row"><span>Z:</span><input type="range" id="right-pos-z" min="-0.5" max="0.5" step="0.01" value="0"><input type="number" id="right-pos-z-num" min="-0.5" max="0.5" step="0.01" value="0"></div>
            </div>
            <label>Rotation (degrees)</label>
            <div class="slider-group">
                <div class="slider-row"><span>X:</span><input type="range" id="right-rot-x" min="-180" max="180" step="1" value="0"><input type="number" id="right-rot-x-num" min="-180" max="180" step="1" value="0"></div>
                <div class="slider-row"><span>Y:</span><input type="range" id="right-rot-y" min="-180" max="180" step="1" value="0"><input type="number" id="right-rot-y-num" min="-180" max="180" step="1" value="0"></div>
                <div class="slider-row"><span>Z:</span><input type="range" id="right-rot-z" min="-180" max="180" step="1" value="0"><input type="number" id="right-rot-z-num" min="-180" max="180" step="1" value="0"></div>
            </div>
        </div>

        <div class="section">
            <h3>Left Hand</h3>
            <select id="left-weapon-select">
                <option value="">(None)</option>
            </select>
            <label>Position</label>
            <div class="slider-group">
                <div class="slider-row"><span>X:</span><input type="range" id="left-pos-x" min="-0.5" max="0.5" step="0.01" value="0"><input type="number" id="left-pos-x-num" min="-0.5" max="0.5" step="0.01" value="0"></div>
                <div class="slider-row"><span>Y:</span><input type="range" id="left-pos-y" min="-0.5" max="0.5" step="0.01" value="0"><input type="number" id="left-pos-y-num" min="-0.5" max="0.5" step="0.01" value="0"></div>
                <div class="slider-row"><span>Z:</span><input type="range" id="left-pos-z" min="-0.5" max="0.5" step="0.01" value="0"><input type="number" id="left-pos-z-num" min="-0.5" max="0.5" step="0.01" value="0"></div>
            </div>
            <label>Rotation (degrees)</label>
            <div class="slider-group">
                <div class="slider-row"><span>X:</span><input type="range" id="left-rot-x" min="-180" max="180" step="1" value="0"><input type="number" id="left-rot-x-num" min="-180" max="180" step="1" value="0"></div>
                <div class="slider-row"><span>Y:</span><input type="range" id="left-rot-y" min="-180" max="180" step="1" value="0"><input type="number" id="left-rot-y-num" min="-180" max="180" step="1" value="0"></div>
                <div class="slider-row"><span>Z:</span><input type="range" id="left-rot-z" min="-180" max="180" step="1" value="0"><input type="number" id="left-rot-z-num" min="-180" max="180" step="1" value="0"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // Ground
        const ground = new THREE.Mesh(
            new THREE.CircleGeometry(2, 32),
            new THREE.MeshStandardMaterial({ color: 0x2a2a4e, roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        scene.add(new THREE.GridHelper(4, 20, 0x444466, 0x333355));

        // Asset paths
        const loader = new GLTFLoader();
        const textureLoader = new THREE.TextureLoader();
        const basePath = 'kaykit-assets/KayKit Adventurers 2.0';
        const charAnimPath = 'kaykit-assets/KayKit Character Animations 1.1';
        const fantasyWeaponsPath = 'kaykit-assets/KayKit Fantasy Weapons Bits 1.0';

        // Weapon definitions: { name, path, hand: 'right'|'left'|'both', offsetZ }
        const weapons = {
            // Adventurers 2.0 weapons
            'Sword 1H': { path: `${basePath}/Assets/gltf/sword_1handed.gltf`, hand: 'right' },
            'Sword 2H': { path: `${basePath}/Assets/gltf/sword_2handed.gltf`, hand: 'right' },
            'Axe 1H': { path: `${basePath}/Assets/gltf/axe_1handed.gltf`, hand: 'right' },

            'Druid Staff': { path: `${basePath}/Assets/gltf/druid_staff.gltf`, hand: 'right' },
            'Bow': { path: `${basePath}/Assets/gltf/bow_withString.gltf`, hand: 'both' },
            'Crossbow 1H': { path: `${basePath}/Assets/gltf/crossbow_1handed.gltf`, hand: 'right' },
            'Crossbow 2H': { path: `${basePath}/Assets/gltf/crossbow_2handed.gltf`, hand: 'right' },
            'Shotgun': { path: `${basePath}/Assets/gltf/shotgun.gltf`, hand: 'right' },
            'Spellbook Open': { path: `${basePath}/Assets/gltf/spellbook_open.gltf`, hand: 'left' },
            'Spellbook Closed': { path: `${basePath}/Assets/gltf/spellbook_closed.gltf`, hand: 'left' },
            'Potion Red': { path: `${basePath}/Assets/gltf/potion_medium_red.gltf`, hand: 'right' },
            'Potion Blue': { path: `${basePath}/Assets/gltf/potion_medium_blue.gltf`, hand: 'right' },
            'Smokebomb': { path: `${basePath}/Assets/gltf/smokebomb.gltf`, hand: 'right' },
            'Mug': { path: `${basePath}/Assets/gltf/mug_full.gltf`, hand: 'right' },
            // Shields
            'Shield Round': { path: `${basePath}/Assets/gltf/shield_round.gltf`, hand: 'left' },
            'Shield Badge': { path: `${basePath}/Assets/gltf/shield_badge.gltf`, hand: 'left' },
            'Shield Square': { path: `${basePath}/Assets/gltf/shield_square.gltf`, hand: 'left' },
            'Shield Spikes': { path: `${basePath}/Assets/gltf/shield_spikes.gltf`, hand: 'left' },
            // Fantasy Weapons
            'FW Sword A': { path: `${fantasyWeaponsPath}/Assets/gltf/sword_A.gltf`, hand: 'right' },
            'FW Sword B': { path: `${fantasyWeaponsPath}/Assets/gltf/sword_B.gltf`, hand: 'right' },

        const characters = {

            'Knight': { file: 'Knight.glb', texture: 'knight', rig: 'Medium', basePath: basePath, textureBase: `${basePath}/Textures` },

            'Skeleton_Rogue': { file: 'Skeleton_Rogue.glb', texture: 'skeleton', rig: 'Medium', basePath: skeletonsPath, charSubPath: 'characters/gltf', textureBase: `${skeletonsPath}/textures`, textureSuffix: '_A' },
            'Skeleton_Mage': { file: 'Skeleton_Mage.glb', texture: 'skeleton', rig: 'Medium', basePath: skeletonsPath, charSubPath: 'characters/gltf', textureBase: `${skeletonsPath}/textures`, textureSuffix: '_A' },
            'Skeleton_Minion': { file: 'Skeleton_Minion.glb', texture: 'skeleton', rig: 'Medium', basePath: skeletonsPath, charSubPath: 'characters/gltf', textureBase: `${skeletonsPath}/textures`, textureSuffix: '_A' },

            'Necromancer': { file: 'Necromancer.glb', texture: 'skeleton', rig: 'Medium', basePath: skeletonsPath, charSubPath: 'characters/gltf', textureBase: `${skeletonsPath}/textures`, textureSuffix: '_A' },

            // Mystery Monthly Series 4
            'Orc_Raider': { file: 'OrcRaider.glb', rig: 'Medium', basePath: mysteryS4Path, charSubPath: '1 - July 2023 - Orc Raider/character', defaultTexture: `${mysteryS4Path}/1 - July 2023 - Orc Raider/textures/orc_texture_A.png` },
            'Driver': { file: 'Driver.glb', rig: 'Medium', basePath: mysteryS4Path, charSubPath: '2 - August 2023 - Driver/character/gltf', defaultTexture: `${mysteryS4Path}/2 - August 2023 - Driver/textures/driver_texture.png` },

            'Werewolf_Man': { file: 'Werewolf_Man.glb', rig: 'Medium', basePath: mysteryS4Path, charSubPath: '4 - October 2023 - Werewolf/characters/gltf', defaultTexture: `${mysteryS4Path}/4 - October 2023 - Werewolf/textures/werewolf_A.png` },
            'Werewolf_Wolf': { file: 'Werewolf_Wolf.glb', rig: 'Medium', basePath: mysteryS4Path, charSubPath: '4 - October 2023 - Werewolf/characters/gltf', defaultTexture: `${mysteryS4Path}/4 - October 2023 - Werewolf/textures/werewolf_A.png` },
            'Animatronic': { file: 'Animatronic_Normal.glb', rig: 'Medium', basePath: mysteryS4Path, charSubPath: '5 - November 2023 - Animatronic/characters/gltf', defaultTexture: `${mysteryS4Path}/5 - November 2023 - Animatronic/textures/animatronic_A.png` },

            // Mystery Monthly Series 5
            'CombatMech': { file: 'CombatMech.glb', rig: 'Large', basePath: mysteryS5Path, charSubPath: '1 - July 2024 - Combat Mech/characters', defaultTexture: `${mysteryS5Path}/1 - July 2024 - Combat Mech/textures/combatmech_texture.png` },
            'Superhero': { file: 'Superhero.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '2 - August 2024 - Superhero/characters', defaultTexture: `${mysteryS5Path}/2 - August 2024 - Superhero/textures/superhero_texture.png` },
            'BlackKnight': { file: 'BlackKnight.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '3 - September 2024 - Black Knight/characters', defaultTexture: `${mysteryS5Path}/3 - September 2024 - Black Knight/textures/blackknight_texture.png` },

            'Witch': { file: 'Witch.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '5 - November 2024 - Witch/characters', defaultTexture: `${mysteryS5Path}/5 - November 2024 - Witch/textures/witch_texture_A.png` },
            'Helper': { file: 'Helper_A.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '6 - December 2024 - Helpers/characters', defaultTexture: `${mysteryS5Path}/6 - December 2024 - Helpers/textures/helpers_texture.png` },
            'Helper_B': { file: 'Helper_B.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '6 - December 2024 - Helpers/characters', defaultTexture: `${mysteryS5Path}/6 - December 2024 - Helpers/textures/helpers_texture.png` },
            'FrostGolem': { file: 'FrostGolem.glb', rig: 'Large', basePath: mysteryS5Path, charSubPath: '7 - January 2025 - FrostGolem/characters', defaultTexture: `${mysteryS5Path}/7 - January 2025 - FrostGolem/textures/frostgolem_texture.png` },
            'Caveman': { file: 'Caveman.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '8 - February 2025 - Caveman/characters', defaultTexture: `${mysteryS5Path}/8 - February 2025 - Caveman/textures/caveman_texture.png` },
            'Clanker': { file: 'Clanker.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '9 - March 2025 - Clanker/characters', defaultTexture: `${mysteryS5Path}/9 - March 2025 - Clanker/textures/clanker_texture.png` },
            'Protagonist': { file: 'Protagonist_A.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '10 - April 2025 - Protagonists/characters', defaultTexture: `${mysteryS5Path}/10 - April 2025 - Protagonists/textures/protagonist_texture.png` },
            'Protagonist_B': { file: 'Protagonist_B.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '10 - April 2025 - Protagonists/characters', defaultTexture: `${mysteryS5Path}/10 - April 2025 - Protagonists/textures/protagonist_texture.png` },
            'Hiker': { file: 'Hiker.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '11 - May 2025 - Hiker/characters', defaultTexture: `${mysteryS5Path}/11 - May 2025 - Hiker/textures/hiker_texture.png` },
            'Tiefling': { file: 'Tiefling.glb', rig: 'Medium', basePath: mysteryS5Path, charSubPath: '12 - June 2025 - Tiefling/characters', defaultTexture: `${mysteryS5Path}/12 - June 2025 - Tiefling/textures/tiefling_texture.png` },

            // Mystery Monthly Series 6
            'Lorekeeper': { file: 'Lorekeeper.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '1 - July 2025 - Lorekeeper/characters', defaultTexture: `${mysteryS6Path}/1 - July 2025 - Lorekeeper/textures/lorekeeper_texture.png` },
            'OrcBrute': { file: 'OrcBrute.glb', rig: 'Large', basePath: mysteryS6Path, charSubPath: '2 - August 2025 - Orc Brute/characters', defaultTexture: `${mysteryS6Path}/2 - August 2025 - Orc Brute/textures/orcbrute_texture_A.png` },
            'Cleric': { file: 'Cleric.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '3 - September 2025 - Cleric/characters', defaultTexture: `${mysteryS6Path}/3 - September 2025 - Cleric/textures/cleric_texture.png` },
            'Monstrosity': { file: 'Monstrosity.glb', rig: 'Large', basePath: mysteryS6Path, charSubPath: '4 - October 2025 - Monstrosity/characters', defaultTexture: `${mysteryS6Path}/4 - October 2025 - Monstrosity/textures/monstrosity_texture_A.png` },
            'PlantWarrior': { file: 'PlantWarrior.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '5 - November 2025 - Plant Warrior/characters', defaultTexture: `${mysteryS6Path}/5 - November 2025 - Plant Warrior/textures/plantcreatures_texture.png` },
            'ToySoldier': { file: 'ToySoldier.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '6 - December 2025 - Toy Soldier/characters', defaultTexture: `${mysteryS6Path}/6 - December 2025 - Toy Soldier/textures/toy_soldier_texture.png` },
            '4GTN': { file: '4GTN.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '7 - January 2026 - 4GTN/characters', defaultTexture: `${mysteryS6Path}/7 - January 2026 - 4GTN/texture/4GTN_texture.png` },
            '4GTN_Forgotten': { file: '4GTN_Forgotten.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '7 - January 2026 - 4GTN/characters', defaultTexture: `${mysteryS6Path}/7 - January 2026 - 4GTN/texture/4GTN_texture.png` },
            'Hoarder': { file: 'Hoarder.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '8 - February 2026 - Hoarder/characters', defaultTexture: `${mysteryS6Path}/8 - February 2026 - Hoarder/textures/hoarder_texture.png` },
            'AvianSwordsman': { file: 'AvianSwordsman.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '9 - March 2026 - Avian Swordsman/characters', defaultTexture: `${mysteryS6Path}/9 - March 2026 - Avian Swordsman/textures/avianswordsman_texture.png` },
            'Marksman': { file: 'Marksman.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '10 - April 2026 - Marksman/characters', defaultTexture: `${mysteryS6Path}/10 - April 2026 - Marksman/textures/marksman_texture.png` },
            'MagicalGirl': { file: 'MagicalGirl.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '11 - May 2026 - Magical Girl/characters', defaultTexture: `${mysteryS6Path}/11 - May 2026 - Magical Girl/textures/magical_girl_texture_A.png` },
            'Farmer': { file: 'Farmer_A.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '12 - June 2026 - Farmers/characters', defaultTexture: `${mysteryS6Path}/12 - June 2026 - Farmers/textures/farmer_texture_A.png` },
            'Farmer_B': { file: 'Farmer_B.glb', rig: 'Medium', basePath: mysteryS6Path, charSubPath: '12 - June 2026 - Farmers/characters', defaultTexture: `${mysteryS6Path}/12 - June 2026 - Farmers/textures/farmer_texture_A.png` },
        };

        // State
        let currentCharacterName = 'Knight';
        let rightHandBone = null;
        let leftHandBone = null;
        let rightProp = null;
        let leftProp = null;
        let characterModel = null;
        let characterMaterials = [];
        let mixer = null;
        let currentAction = null;
        let allAnimations = {};
        let animationsLoaded = false;
        const clock = new THREE.Clock();

        // Populate weapon dropdowns
        function populateWeaponDropdowns() {
            const rightSelect = document.getElementById('right-weapon-select');
            const leftSelect = document.getElementById('left-weapon-select');

            rightSelect.innerHTML = '<option value="">(None)</option>';
            leftSelect.innerHTML = '<option value="">(None)</option>';

            for (const [name, data] of Object.entries(weapons)) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;

                if (data.hand === 'right' || data.hand === 'both') {
                    rightSelect.appendChild(option.cloneNode(true));
                }
                if (data.hand === 'left' || data.hand === 'both') {
                    leftSelect.appendChild(option.cloneNode(true));
                }
            }

            // Set defaults
            rightSelect.value = 'Sword 1H';
            leftSelect.value = 'Shield Round';
        }

        // Load and attach a weapon
        function loadWeapon(weaponName, hand) {
            const bone = hand === 'right' ? rightHandBone : leftHandBone;
            const currentProp = hand === 'right' ? rightProp : leftProp;

            // Remove current prop
            if (currentProp && bone) {
                bone.remove(currentProp);
            }

            if (!weaponName || !weapons[weaponName]) {
                if (hand === 'right') rightProp = null;
                else leftProp = null;
                return;
            }

            const weapon = weapons[weaponName];
            const offsetZ = weapon.offsetZ || 0;

            loader.load(weapon.path, (gltf) => {
                const prop = gltf.scene;
                prop.position.set(0, 0, offsetZ);

                prop.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                bone.add(prop);

                const degToRad = (deg) => deg * Math.PI / 180;

                if (hand === 'right') {
                    rightProp = prop;
                    // Sync with slider values
                    prop.position.x = parseFloat(document.getElementById('right-pos-x').value);
                    prop.position.y = parseFloat(document.getElementById('right-pos-y').value);
                    prop.position.z = parseFloat(document.getElementById('right-pos-z').value);
                    prop.rotation.x = degToRad(parseFloat(document.getElementById('right-rot-x').value));
                    prop.rotation.y = degToRad(parseFloat(document.getElementById('right-rot-y').value));
                    prop.rotation.z = degToRad(parseFloat(document.getElementById('right-rot-z').value));
                } else {
                    leftProp = prop;
                    prop.position.x = parseFloat(document.getElementById('left-pos-x').value);
                    prop.position.y = parseFloat(document.getElementById('left-pos-y').value);
                    prop.position.z = parseFloat(document.getElementById('left-pos-z').value);
                    prop.rotation.x = degToRad(parseFloat(document.getElementById('left-rot-x').value));
                    prop.rotation.y = degToRad(parseFloat(document.getElementById('left-rot-y').value));
                    prop.rotation.z = degToRad(parseFloat(document.getElementById('left-rot-z').value));
                }

                console.log(`Loaded ${weaponName} in ${hand} hand`);
            }, undefined, (err) => {
                console.error(`Failed to load ${weaponName}:`, err);
            });
        }

        // Get animation paths for a specific rig type
        function getAnimPaths(rigType) {
            const rig = `Rig_${rigType}`;
            return [
                `${basePath}/Animations/gltf/${rig}/${rig}_General.glb`,
                `${basePath}/Animations/gltf/${rig}/${rig}_MovementBasic.glb`,
                `${charAnimPath}/Animations/gltf/${rig}/${rig}_CombatMelee.glb`,
                `${charAnimPath}/Animations/gltf/${rig}/${rig}_CombatRanged.glb`,
                `${charAnimPath}/Animations/gltf/${rig}/${rig}_MovementAdvanced.glb`,
                `${charAnimPath}/Animations/gltf/${rig}/${rig}_Simulation.glb`,
                `${charAnimPath}/Animations/gltf/${rig}/${rig}_Tools.glb`,
            ];
        }

        // Load animations
        let currentRigType = null;
        function loadAnimations(rigType = 'Medium') {
            // Skip if already loaded for this rig
            if (currentRigType === rigType && animationsLoaded) return;

            currentRigType = rigType;
            allAnimations = {};
            animationsLoaded = false;

            const select = document.getElementById('animation-select');
            select.innerHTML = '<option value="">(None - T-Pose)</option>';

            const paths = getAnimPaths(rigType);
            let loadedCount = 0;

            paths.forEach((animPath) => {
                loader.load(animPath, (gltf) => {
                    const packName = animPath.split('/').pop().replace('.glb', '').replace(`Rig_${rigType}_`, '');
                    console.log(`Loaded ${packName}:`, gltf.animations.map(a => a.name));

                    gltf.animations.forEach((clip) => {
                        if (clip.name === 'T-Pose') return;

                        allAnimations[clip.name] = clip;

                        const option = document.createElement('option');
                        option.value = clip.name;
                        option.textContent = clip.name;
                        select.appendChild(option);
                    });

                    loadedCount++;
                    if (loadedCount === paths.length) {
                        // Sort options alphabetically
                        const options = Array.from(select.options).slice(1);
                        options.sort((a, b) => a.text.localeCompare(b.text));
                        select.innerHTML = '<option value="">(None - T-Pose)</option>';
                        options.forEach(opt => select.appendChild(opt));
                        animationsLoaded = true;
                        console.log('All animations loaded:', Object.keys(allAnimations).length);
                    }
                }, undefined, (err) => {
                    console.warn(`Failed to load animations from ${animPath}:`, err);
                    loadedCount++;
                });
            });
        }

        // Play animation
        function playAnimation(name) {
            if (currentAction) {
                currentAction.fadeOut(0.2);
            }

            if (!name || !allAnimations[name]) {
                currentAction = null;
                return;
            }

            const clip = allAnimations[name];
            currentAction = mixer.clipAction(clip);
            currentAction.reset();
            currentAction.fadeIn(0.2);
            currentAction.play();
        }

        // Change skin texture
        function changeSkin(variant) {
            const charDef = characters[currentCharacterName];

            // Characters without texture support
            if (!charDef.texture) {
                console.log('This character does not support skin variants');
                return;
            }

            // Build texture path based on character type
            const textureBase = charDef.textureBase || `${basePath}/Textures`;
            const texturePath = `${textureBase}/${charDef.texture}_texture${variant}.png`;

            textureLoader.load(texturePath, (texture) => {
                texture.flipY = false;
                texture.colorSpace = THREE.SRGBColorSpace;

                characterMaterials.forEach(mat => {
                    mat.map = texture;
                    mat.needsUpdate = true;
                });

                console.log(`Skin changed to: ${charDef.texture}_texture${variant}.png`);
            }, undefined, (err) => {
                console.error('Failed to load texture:', err);
            });
        }

        // Update skin dropdown based on character type
        function updateSkinDropdown(charDef) {
            const skinSelect = document.getElementById('skin-select');
            skinSelect.innerHTML = '';

            if (!charDef.texture) {
                // No texture support
                skinSelect.innerHTML = '<option value="">(No skins)</option>';
                skinSelect.disabled = true;
                return;
            }

            skinSelect.disabled = false;

            if (charDef.textureSuffix) {
                // Skeleton-style textures (_A, _B)
                skinSelect.innerHTML = `
                    <option value="_A">Variant A</option>
                    <option value="_B">Variant B</option>
                `;
                skinSelect.value = charDef.textureSuffix;
            } else {
                // Adventurer-style textures
                skinSelect.innerHTML = `
                    <option value="">Default</option>
                    <option value="_alt_A">Alt A</option>
                    <option value="_alt_B">Alt B</option>
                    <option value="_alt_C">Alt C</option>
                `;
            }
        }

        // Load character model
        function loadCharacter(charName) {
            const charDef = characters[charName];
            if (!charDef) return;

            // Store current weapon selections
            const rightWeapon = document.getElementById('right-weapon-select').value;
            const leftWeapon = document.getElementById('left-weapon-select').value;

            // Remove old character
            if (characterModel) {
                scene.remove(characterModel);
                characterModel = null;
            }

            // Reset state
            rightHandBone = null;
            leftHandBone = null;
            rightProp = null;
            leftProp = null;
            characterMaterials = [];
            currentAction = null;

            // Build model path - handle different folder structures
            const charBasePath = charDef.basePath || basePath;
            const charSubPath = charDef.charSubPath || 'Characters/gltf';
            const modelPath = `${charBasePath}/${charSubPath}/${charDef.file}`;

            loader.load(modelPath, (gltf) => {
                characterModel = gltf.scene;
                currentCharacterName = charName;

                characterModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            characterMaterials.push(child.material);
                        }
                    }

                    if (child.name === 'handslotr') {
                        rightHandBone = child;
                    }
                    if (child.name === 'handslotl') {
                        leftHandBone = child;
                    }
                });

                scene.add(characterModel);

                // Setup mixer
                mixer = new THREE.AnimationMixer(characterModel);

                // Update title
                document.querySelector('#info h1').textContent = charName.replace(/_/g, ' ');

                // Update skin dropdown for this character type
                updateSkinDropdown(charDef);

                // Apply default texture if specified (for Mystery Monthly characters)
                if (charDef.defaultTexture) {
                    textureLoader.load(charDef.defaultTexture, (texture) => {
                        texture.flipY = false;
                        texture.colorSpace = THREE.SRGBColorSpace;
                        characterMaterials.forEach(mat => {
                            mat.map = texture;
                            mat.needsUpdate = true;
                        });
                        console.log(`Applied texture: ${charDef.defaultTexture}`);
                    }, undefined, (err) => {
                        console.warn(`Failed to load texture: ${charDef.defaultTexture}`, err);
                    });
                }

                // Load animations for this rig type if needed
                loadAnimations(charDef.rig);

                // Re-attach weapons
                if (rightWeapon) loadWeapon(rightWeapon, 'right');
                if (leftWeapon) loadWeapon(leftWeapon, 'left');

                console.log(`${charName} loaded`);
            });
        }

        // Initial load
        populateWeaponDropdowns();
        loadCharacter('Knight');

        // Event handlers
        document.getElementById('character-select').addEventListener('change', (e) => {
            loadCharacter(e.target.value);
        });

        document.getElementById('animation-select').addEventListener('change', (e) => {
            playAnimation(e.target.value);
        });

        document.getElementById('right-weapon-select').addEventListener('change', (e) => {
            loadWeapon(e.target.value, 'right');
        });

        document.getElementById('left-weapon-select').addEventListener('change', (e) => {
            loadWeapon(e.target.value, 'left');
        });

        document.getElementById('skin-select').addEventListener('change', (e) => {
            changeSkin(e.target.value);
        });

        let animationPaused = false;
        document.getElementById('anim-pause').addEventListener('click', () => {
            animationPaused = !animationPaused;
            if (currentAction) {
                currentAction.paused = animationPaused;
            }
            document.getElementById('anim-pause').textContent = animationPaused ? 'Play' : 'Pause';
        });

        document.getElementById('anim-reset').addEventListener('click', () => {
            if (currentAction) {
                currentAction.reset();
                currentAction.play();
                animationPaused = false;
                currentAction.paused = false;
                document.getElementById('anim-pause').textContent = 'Pause';
            }
        });

        // Slider setup - links slider and number input together
        function setupSliderPair(sliderId, numId, updateFn) {
            const slider = document.getElementById(sliderId);
            const numInput = document.getElementById(numId);

            slider.addEventListener('input', () => {
                numInput.value = slider.value;
                updateFn(parseFloat(slider.value));
            });

            numInput.addEventListener('input', () => {
                slider.value = numInput.value;
                updateFn(parseFloat(numInput.value));
            });
        }

        // Convert degrees to radians
        const degToRad = (deg) => deg * Math.PI / 180;

        // Right hand position
        setupSliderPair('right-pos-x', 'right-pos-x-num', (v) => { if (rightProp) rightProp.position.x = v; });
        setupSliderPair('right-pos-y', 'right-pos-y-num', (v) => { if (rightProp) rightProp.position.y = v; });
        setupSliderPair('right-pos-z', 'right-pos-z-num', (v) => { if (rightProp) rightProp.position.z = v; });

        // Right hand rotation
        setupSliderPair('right-rot-x', 'right-rot-x-num', (v) => { if (rightProp) rightProp.rotation.x = degToRad(v); });
        setupSliderPair('right-rot-y', 'right-rot-y-num', (v) => { if (rightProp) rightProp.rotation.y = degToRad(v); });
        setupSliderPair('right-rot-z', 'right-rot-z-num', (v) => { if (rightProp) rightProp.rotation.z = degToRad(v); });

        // Left hand position
        setupSliderPair('left-pos-x', 'left-pos-x-num', (v) => { if (leftProp) leftProp.position.x = v; });
        setupSliderPair('left-pos-y', 'left-pos-y-num', (v) => { if (leftProp) leftProp.position.y = v; });
        setupSliderPair('left-pos-z', 'left-pos-z-num', (v) => { if (leftProp) leftProp.position.z = v; });

        // Left hand rotation
        setupSliderPair('left-rot-x', 'left-rot-x-num', (v) => { if (leftProp) leftProp.rotation.x = degToRad(v); });
        setupSliderPair('left-rot-y', 'left-rot-y-num', (v) => { if (leftProp) leftProp.rotation.y = degToRad(v); });
        setupSliderPair('left-rot-z', 'left-rot-z-num', (v) => { if (leftProp) leftProp.rotation.z = degToRad(v); });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
