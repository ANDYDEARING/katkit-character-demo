<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KayKit Character Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h1>Knight</h1>
        <p>Drag to rotate | Scroll to zoom</p>
        <div id="props-status" style="margin-top: 10px; font-size: 12px;">
            <div>Right hand: <span id="right-prop">loading...</span></div>
            <div>Left hand: <span id="left-prop">loading...</span></div>
        </div>
    </div>

    <div id="controls" style="position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; font-size: 12px; min-width: 220px;">
        <h3 style="margin: 0 0 10px 0; font-size: 14px;">Animation</h3>
        <select id="animation-select" style="width: 100%; padding: 5px; margin-bottom: 15px;">
            <option value="">Loading animations...</option>
        </select>

        <h3 style="margin: 0 0 10px 0; font-size: 14px;">Right Hand (Sword)</h3>
        <div style="margin-bottom: 5px;">
            <label>X: <span id="right-x-val">0</span></label>
            <input type="range" id="right-x" min="-0.5" max="0.5" step="0.01" value="0" style="width: 100%;">
        </div>
        <div style="margin-bottom: 5px;">
            <label>Y: <span id="right-y-val">0</span></label>
            <input type="range" id="right-y" min="-0.5" max="0.5" step="0.01" value="0" style="width: 100%;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Z: <span id="right-z-val">0</span></label>
            <input type="range" id="right-z" min="-0.5" max="0.5" step="0.01" value="0" style="width: 100%;">
        </div>

        <h3 style="margin: 0 0 10px 0; font-size: 14px;">Left Hand (Shield)</h3>
        <div style="margin-bottom: 5px;">
            <label>X: <span id="left-x-val">0</span></label>
            <input type="range" id="left-x" min="-0.5" max="0.5" step="0.01" value="0" style="width: 100%;">
        </div>
        <div style="margin-bottom: 5px;">
            <label>Y: <span id="left-y-val">0</span></label>
            <input type="range" id="left-y" min="-0.5" max="0.5" step="0.01" value="0" style="width: 100%;">
        </div>
        <div style="margin-bottom: 5px;">
            <label>Z: <span id="left-z-val">0.2</span></label>
            <input type="range" id="left-z" min="-0.5" max="0.5" step="0.01" value="0.2" style="width: 100%;">
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 1.5, 3);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // Ground plane
        const groundGeometry = new THREE.CircleGeometry(2, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a4e,
            roughness: 0.8
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper
        const gridHelper = new THREE.GridHelper(4, 20, 0x444466, 0x333355);
        scene.add(gridHelper);

        // Asset paths
        const loader = new GLTFLoader();
        const basePath = 'kaykit-assets/KayKit Adventurers 2.0';
        const modelPath = `${basePath}/Characters/gltf/Knight.glb`;
        const swordPath = `${basePath}/Assets/gltf/sword_1handed.gltf`;
        const shieldPath = `${basePath}/Assets/gltf/shield_round.gltf`;
        const animPaths = [
            `${basePath}/Animations/gltf/Rig_Medium/Rig_Medium_General.glb`,
            `${basePath}/Animations/gltf/Rig_Medium/Rig_Medium_MovementBasic.glb`
        ];

        // Store references for props attachment
        let rightHandBone = null;
        let leftHandBone = null;
        let rightProp = null;
        let leftProp = null;

        // Animation state
        let mixer = null;
        let currentAction = null;
        let allAnimations = {};
        const clock = new THREE.Clock();

        // Helper to log skeleton hierarchy
        function logSkeleton(object, indent = '') {
            console.log(indent + object.name + ' (' + object.type + ')');
            for (const child of object.children) {
                logSkeleton(child, indent + '  ');
            }
        }

        // Load props and attach to hands
        function attachProp(propPath, bone, propName, statusElementId, offset = {x: 0, y: 0, z: 0}, rotation = {x: 0, y: 0, z: 0}, scale = 1, onLoad = null) {
            const statusEl = document.getElementById(statusElementId);

            loader.load(propPath, (gltf) => {
                const prop = gltf.scene;
                prop.position.set(offset.x, offset.y, offset.z);
                prop.rotation.set(rotation.x, rotation.y, rotation.z);
                prop.scale.setScalar(scale);

                prop.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                bone.add(prop);
                console.log(`Attached ${propName} to ${bone.name}`);
                if (statusEl) statusEl.textContent = propName;
                if (onLoad) onLoad(prop);
            }, undefined, (error) => {
                console.error(`Failed to load ${propName}:`, error);
                if (statusEl) statusEl.textContent = 'failed to load';
            });
        }

        // Load animations from GLB files and populate dropdown
        function loadAnimations(targetModel) {
            const select = document.getElementById('animation-select');
            select.innerHTML = '<option value="">(None - T-Pose)</option>';

            let loadedCount = 0;

            animPaths.forEach((animPath) => {
                loader.load(animPath, (gltf) => {
                    console.log(`Loaded animations from ${animPath}:`, gltf.animations.map(a => a.name));

                    gltf.animations.forEach((clip) => {
                        // Skip T-Pose as it's the default
                        if (clip.name === 'T-Pose') return;

                        allAnimations[clip.name] = clip;

                        const option = document.createElement('option');
                        option.value = clip.name;
                        option.textContent = clip.name;
                        select.appendChild(option);
                    });

                    loadedCount++;
                    if (loadedCount === animPaths.length) {
                        console.log('All animations loaded:', Object.keys(allAnimations));
                    }
                });
            });
        }

        // Play selected animation
        function playAnimation(name) {
            if (currentAction) {
                currentAction.fadeOut(0.2);
            }

            if (!name || !allAnimations[name]) {
                currentAction = null;
                return;
            }

            const clip = allAnimations[name];
            currentAction = mixer.clipAction(clip);
            currentAction.reset();
            currentAction.fadeIn(0.2);
            currentAction.play();
        }

        // Animation dropdown handler
        document.getElementById('animation-select').addEventListener('change', (e) => {
            playAnimation(e.target.value);
        });

        // Load the Knight model
        loader.load(
            modelPath,
            (gltf) => {
                const model = gltf.scene;

                // Log full skeleton structure to find bone names
                console.log('=== Model Hierarchy ===');
                logSkeleton(model);

                // Enable shadows and find hand bones
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }

                    // Look for hand bones (common naming patterns)
                    const name = child.name.toLowerCase();
                    if (name.includes('hand') || name.includes('wrist') || name.includes('palm')) {
                        console.log('Found potential hand bone:', child.name);
                    }

                    // KayKit uses handslotl and handslotr for prop attachment
                    if (child.name === 'handslotr') {
                        rightHandBone = child;
                        console.log('Right hand slot found:', child.name);
                    }
                    if (child.name === 'handslotl') {
                        leftHandBone = child;
                        console.log('Left hand slot found:', child.name);
                    }
                });

                scene.add(model);
                console.log('Knight model loaded successfully!');

                // After model loads, attach props if bones were found
                if (rightHandBone) {
                    // Sword in right hand
                    attachProp(swordPath, rightHandBone, 'Sword', 'right-prop',
                        {x: 0, y: 0, z: 0},
                        {x: 0, y: 0, z: 0},
                        1,
                        (prop) => { rightProp = prop; }
                    );
                } else {
                    document.getElementById('right-prop').textContent = 'no bone found';
                }

                if (leftHandBone) {
                    // Shield in left hand - z offset 0.2 to position on forearm
                    attachProp(shieldPath, leftHandBone, 'Shield', 'left-prop',
                        {x: 0, y: 0, z: 0.2},
                        {x: 0, y: 0, z: 0},
                        1,
                        (prop) => { leftProp = prop; }
                    );
                } else {
                    document.getElementById('left-prop').textContent = 'no bone found';
                }

                // Set up animation mixer for this model
                mixer = new THREE.AnimationMixer(model);

                // Load all animation files
                loadAnimations(model);
            },
            (progress) => {
                console.log('Loading...', (progress.loaded / progress.total * 100).toFixed(1) + '%');
            },
            (error) => {
                console.error('Error loading model:', error);
            }
        );

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Slider controls for prop positioning
        function setupSlider(id, valId, updateFn) {
            const slider = document.getElementById(id);
            const valDisplay = document.getElementById(valId);
            slider.addEventListener('input', () => {
                valDisplay.textContent = slider.value;
                updateFn(parseFloat(slider.value));
            });
        }

        // Right hand (sword) sliders
        setupSlider('right-x', 'right-x-val', (v) => { if (rightProp) rightProp.position.x = v; });
        setupSlider('right-y', 'right-y-val', (v) => { if (rightProp) rightProp.position.y = v; });
        setupSlider('right-z', 'right-z-val', (v) => { if (rightProp) rightProp.position.z = v; });

        // Left hand (shield) sliders
        setupSlider('left-x', 'left-x-val', (v) => { if (leftProp) leftProp.position.x = v; });
        setupSlider('left-y', 'left-y-val', (v) => { if (leftProp) leftProp.position.y = v; });
        setupSlider('left-z', 'left-z-val', (v) => { if (leftProp) leftProp.position.z = v; });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) {
                mixer.update(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
