<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KayKit Character Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #aaa;
        }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            min-width: 240px;
            max-height: 90vh;
            overflow-y: auto;
        }
        #controls h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #8af;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
        #controls select {
            width: 100%;
            padding: 5px;
            margin-bottom: 12px;
            background: #333;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
        }
        #controls label {
            display: block;
            margin-bottom: 3px;
            color: #aaa;
        }
        .slider-group {
            margin-bottom: 12px;
        }
        .slider-group input {
            width: 100%;
        }
        .section {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h1>Knight</h1>
        <p>Drag to rotate | Scroll to zoom</p>
    </div>

    <div id="controls">
        <div class="section">
            <h3>Skin</h3>
            <select id="skin-select">
                <option value="">Default</option>
                <option value="_alt_A">Alt A</option>
                <option value="_alt_B">Alt B</option>
                <option value="_alt_C">Alt C</option>
            </select>
        </div>

        <div class="section">
            <h3>Animation</h3>
            <select id="animation-select">
                <option value="">Loading...</option>
            </select>
        </div>

        <div class="section">
            <h3>Right Hand</h3>
            <select id="right-weapon-select">
                <option value="">(None)</option>
            </select>
            <div class="slider-group">
                <label>X: <span id="right-x-val">0</span></label>
                <input type="range" id="right-x" min="-0.5" max="0.5" step="0.01" value="0">
            </div>
            <div class="slider-group">
                <label>Y: <span id="right-y-val">0</span></label>
                <input type="range" id="right-y" min="-0.5" max="0.5" step="0.01" value="0">
            </div>
            <div class="slider-group">
                <label>Z: <span id="right-z-val">0</span></label>
                <input type="range" id="right-z" min="-0.5" max="0.5" step="0.01" value="0">
            </div>
        </div>

        <div class="section">
            <h3>Left Hand</h3>
            <select id="left-weapon-select">
                <option value="">(None)</option>
            </select>
            <div class="slider-group">
                <label>X: <span id="left-x-val">0</span></label>
                <input type="range" id="left-x" min="-0.5" max="0.5" step="0.01" value="0">
            </div>
            <div class="slider-group">
                <label>Y: <span id="left-y-val">0</span></label>
                <input type="range" id="left-y" min="-0.5" max="0.5" step="0.01" value="0">
            </div>
            <div class="slider-group">
                <label>Z: <span id="left-z-val">0.2</span></label>
                <input type="range" id="left-z" min="-0.5" max="0.5" step="0.01" value="0.2">
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // Ground
        const ground = new THREE.Mesh(
            new THREE.CircleGeometry(2, 32),
            new THREE.MeshStandardMaterial({ color: 0x2a2a4e, roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        scene.add(new THREE.GridHelper(4, 20, 0x444466, 0x333355));

        // Asset paths
        const loader = new GLTFLoader();
        const textureLoader = new THREE.TextureLoader();
        const basePath = 'kaykit-assets/KayKit Adventurers 2.0';
        const charAnimPath = 'kaykit-assets/KayKit Character Animations 1.1';
        const fantasyWeaponsPath = 'kaykit-assets/KayKit Fantasy Weapons Bits 1.0';

        // All animation packs
        const animPaths = [
            `${basePath}/Animations/gltf/Rig_Medium/Rig_Medium_General.glb`,
            `${basePath}/Animations/gltf/Rig_Medium/Rig_Medium_MovementBasic.glb`,
            `${charAnimPath}/Animations/gltf/Rig_Medium/Rig_Medium_CombatMelee.glb`,
            `${charAnimPath}/Animations/gltf/Rig_Medium/Rig_Medium_CombatRanged.glb`,
            `${charAnimPath}/Animations/gltf/Rig_Medium/Rig_Medium_MovementAdvanced.glb`,
            `${charAnimPath}/Animations/gltf/Rig_Medium/Rig_Medium_Simulation.glb`,
            `${charAnimPath}/Animations/gltf/Rig_Medium/Rig_Medium_Tools.glb`,
        ];

        // Weapon definitions: { name, path, hand: 'right'|'left'|'both', offsetZ }
        const weapons = {
            // Adventurers 2.0 weapons
            'Sword 1H': { path: `${basePath}/Assets/gltf/sword_1handed.gltf`, hand: 'right' },
            'Sword 2H': { path: `${basePath}/Assets/gltf/sword_2handed.gltf`, hand: 'right' },
            'Axe 1H': { path: `${basePath}/Assets/gltf/axe_1handed.gltf`, hand: 'right' },
            'Axe 2H': { path: `${basePath}/Assets/gltf/axe_2handed.gltf`, hand: 'right' },
            'Dagger': { path: `${basePath}/Assets/gltf/dagger.gltf`, hand: 'right' },
            'Staff': { path: `${basePath}/Assets/gltf/staff.gltf`, hand: 'right' },
            'Wand': { path: `${basePath}/Assets/gltf/wand.gltf`, hand: 'right' },
            'Druid Staff': { path: `${basePath}/Assets/gltf/druid_staff.gltf`, hand: 'right' },
            'Bow': { path: `${basePath}/Assets/gltf/bow_withString.gltf`, hand: 'left' },
            'Crossbow 1H': { path: `${basePath}/Assets/gltf/crossbow_1handed.gltf`, hand: 'right' },
            'Crossbow 2H': { path: `${basePath}/Assets/gltf/crossbow_2handed.gltf`, hand: 'right' },
            'Shotgun': { path: `${basePath}/Assets/gltf/shotgun.gltf`, hand: 'right' },
            'Spellbook Open': { path: `${basePath}/Assets/gltf/spellbook_open.gltf`, hand: 'left' },
            'Spellbook Closed': { path: `${basePath}/Assets/gltf/spellbook_closed.gltf`, hand: 'left' },
            'Potion Red': { path: `${basePath}/Assets/gltf/potion_medium_red.gltf`, hand: 'right' },
            'Potion Blue': { path: `${basePath}/Assets/gltf/potion_medium_blue.gltf`, hand: 'right' },
            'Smokebomb': { path: `${basePath}/Assets/gltf/smokebomb.gltf`, hand: 'right' },
            'Mug': { path: `${basePath}/Assets/gltf/mug_full.gltf`, hand: 'right' },
            // Shields
            'Shield Round': { path: `${basePath}/Assets/gltf/shield_round.gltf`, hand: 'left', offsetZ: 0.2 },
            'Shield Badge': { path: `${basePath}/Assets/gltf/shield_badge.gltf`, hand: 'left', offsetZ: 0.2 },
            'Shield Square': { path: `${basePath}/Assets/gltf/shield_square.gltf`, hand: 'left', offsetZ: 0.2 },
            'Shield Spikes': { path: `${basePath}/Assets/gltf/shield_spikes.gltf`, hand: 'left', offsetZ: 0.2 },
            // Fantasy Weapons
            'FW Sword A': { path: `${fantasyWeaponsPath}/Assets/gltf/sword_A.gltf`, hand: 'right' },
            'FW Sword B': { path: `${fantasyWeaponsPath}/Assets/gltf/sword_B.gltf`, hand: 'right' },
            'FW Sword C': { path: `${fantasyWeaponsPath}/Assets/gltf/sword_C.gltf`, hand: 'right' },
            'FW Sword D': { path: `${fantasyWeaponsPath}/Assets/gltf/sword_D.gltf`, hand: 'right' },
            'FW Axe A': { path: `${fantasyWeaponsPath}/Assets/gltf/axe_A.gltf`, hand: 'right' },
            'FW Axe B': { path: `${fantasyWeaponsPath}/Assets/gltf/axe_B.gltf`, hand: 'right' },
            'FW Hammer A': { path: `${fantasyWeaponsPath}/Assets/gltf/hammer_A.gltf`, hand: 'right' },
            'FW Hammer B': { path: `${fantasyWeaponsPath}/Assets/gltf/hammer_B.gltf`, hand: 'right' },
            'FW Dagger A': { path: `${fantasyWeaponsPath}/Assets/gltf/dagger_A.gltf`, hand: 'right' },
            'FW Dagger B': { path: `${fantasyWeaponsPath}/Assets/gltf/dagger_B.gltf`, hand: 'right' },
            'FW Staff A': { path: `${fantasyWeaponsPath}/Assets/gltf/staff_A.gltf`, hand: 'right' },
            'FW Staff B': { path: `${fantasyWeaponsPath}/Assets/gltf/staff_B.gltf`, hand: 'right' },
            'FW Wand A': { path: `${fantasyWeaponsPath}/Assets/gltf/wand_A.gltf`, hand: 'right' },
            'FW Spear A': { path: `${fantasyWeaponsPath}/Assets/gltf/spear_A.gltf`, hand: 'right' },
            'FW Halberd': { path: `${fantasyWeaponsPath}/Assets/gltf/halberd.gltf`, hand: 'right' },
            'FW Scythe': { path: `${fantasyWeaponsPath}/Assets/gltf/scythe.gltf`, hand: 'right' },
            'FW Bow A': { path: `${fantasyWeaponsPath}/Assets/gltf/bow_A_withString.gltf`, hand: 'left' },
            'FW Shield A': { path: `${fantasyWeaponsPath}/Assets/gltf/shield_A.gltf`, hand: 'left', offsetZ: 0.2 },
            'FW Shield B': { path: `${fantasyWeaponsPath}/Assets/gltf/shield_B.gltf`, hand: 'left', offsetZ: 0.2 },
            'FW Shield C': { path: `${fantasyWeaponsPath}/Assets/gltf/shield_C.gltf`, hand: 'left', offsetZ: 0.2 },
        };

        // State
        let rightHandBone = null;
        let leftHandBone = null;
        let rightProp = null;
        let leftProp = null;
        let characterModel = null;
        let characterMaterials = [];
        let mixer = null;
        let currentAction = null;
        let allAnimations = {};
        const clock = new THREE.Clock();

        // Populate weapon dropdowns
        function populateWeaponDropdowns() {
            const rightSelect = document.getElementById('right-weapon-select');
            const leftSelect = document.getElementById('left-weapon-select');

            rightSelect.innerHTML = '<option value="">(None)</option>';
            leftSelect.innerHTML = '<option value="">(None)</option>';

            for (const [name, data] of Object.entries(weapons)) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;

                if (data.hand === 'right' || data.hand === 'both') {
                    rightSelect.appendChild(option.cloneNode(true));
                }
                if (data.hand === 'left' || data.hand === 'both') {
                    leftSelect.appendChild(option.cloneNode(true));
                }
            }

            // Set defaults
            rightSelect.value = 'Sword 1H';
            leftSelect.value = 'Shield Round';
        }

        // Load and attach a weapon
        function loadWeapon(weaponName, hand) {
            const bone = hand === 'right' ? rightHandBone : leftHandBone;
            const currentProp = hand === 'right' ? rightProp : leftProp;

            // Remove current prop
            if (currentProp && bone) {
                bone.remove(currentProp);
            }

            if (!weaponName || !weapons[weaponName]) {
                if (hand === 'right') rightProp = null;
                else leftProp = null;
                return;
            }

            const weapon = weapons[weaponName];
            const offsetZ = weapon.offsetZ || 0;

            loader.load(weapon.path, (gltf) => {
                const prop = gltf.scene;
                prop.position.set(0, 0, offsetZ);

                prop.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                bone.add(prop);

                if (hand === 'right') {
                    rightProp = prop;
                    // Sync with slider values
                    prop.position.x = parseFloat(document.getElementById('right-x').value);
                    prop.position.y = parseFloat(document.getElementById('right-y').value);
                    prop.position.z = parseFloat(document.getElementById('right-z').value);
                } else {
                    leftProp = prop;
                    prop.position.x = parseFloat(document.getElementById('left-x').value);
                    prop.position.y = parseFloat(document.getElementById('left-y').value);
                    prop.position.z = parseFloat(document.getElementById('left-z').value);
                }

                console.log(`Loaded ${weaponName} in ${hand} hand`);
            }, undefined, (err) => {
                console.error(`Failed to load ${weaponName}:`, err);
            });
        }

        // Load animations
        function loadAnimations() {
            const select = document.getElementById('animation-select');
            select.innerHTML = '<option value="">(None - T-Pose)</option>';

            let loadedCount = 0;

            animPaths.forEach((animPath) => {
                loader.load(animPath, (gltf) => {
                    const packName = animPath.split('/').pop().replace('.glb', '').replace('Rig_Medium_', '');
                    console.log(`Loaded ${packName}:`, gltf.animations.map(a => a.name));

                    gltf.animations.forEach((clip) => {
                        if (clip.name === 'T-Pose') return;

                        allAnimations[clip.name] = clip;

                        const option = document.createElement('option');
                        option.value = clip.name;
                        option.textContent = clip.name;
                        select.appendChild(option);
                    });

                    loadedCount++;
                    if (loadedCount === animPaths.length) {
                        // Sort options alphabetically
                        const options = Array.from(select.options).slice(1);
                        options.sort((a, b) => a.text.localeCompare(b.text));
                        select.innerHTML = '<option value="">(None - T-Pose)</option>';
                        options.forEach(opt => select.appendChild(opt));
                        console.log('All animations loaded:', Object.keys(allAnimations).length);
                    }
                }, undefined, (err) => {
                    console.warn(`Failed to load animations from ${animPath}:`, err);
                    loadedCount++;
                });
            });
        }

        // Play animation
        function playAnimation(name) {
            if (currentAction) {
                currentAction.fadeOut(0.2);
            }

            if (!name || !allAnimations[name]) {
                currentAction = null;
                return;
            }

            const clip = allAnimations[name];
            currentAction = mixer.clipAction(clip);
            currentAction.reset();
            currentAction.fadeIn(0.2);
            currentAction.play();
        }

        // Change skin texture
        function changeSkin(variant) {
            const texturePath = `${basePath}/Textures/knight_texture${variant}.png`;

            textureLoader.load(texturePath, (texture) => {
                texture.flipY = false;
                texture.colorSpace = THREE.SRGBColorSpace;

                characterMaterials.forEach(mat => {
                    mat.map = texture;
                    mat.needsUpdate = true;
                });

                console.log(`Skin changed to: knight_texture${variant}.png`);
            }, undefined, (err) => {
                console.error('Failed to load texture:', err);
            });
        }

        // Load Knight model
        loader.load(
            `${basePath}/Characters/gltf/Knight.glb`,
            (gltf) => {
                characterModel = gltf.scene;

                characterModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            characterMaterials.push(child.material);
                        }
                    }

                    if (child.name === 'handslotr') {
                        rightHandBone = child;
                    }
                    if (child.name === 'handslotl') {
                        leftHandBone = child;
                    }
                });

                scene.add(characterModel);
                console.log('Knight loaded');

                // Setup mixer
                mixer = new THREE.AnimationMixer(characterModel);

                // Load animations
                loadAnimations();

                // Load default weapons
                populateWeaponDropdowns();
                loadWeapon('Sword 1H', 'right');
                loadWeapon('Shield Round', 'left');
            }
        );

        // Event handlers
        document.getElementById('animation-select').addEventListener('change', (e) => {
            playAnimation(e.target.value);
        });

        document.getElementById('right-weapon-select').addEventListener('change', (e) => {
            loadWeapon(e.target.value, 'right');
        });

        document.getElementById('left-weapon-select').addEventListener('change', (e) => {
            loadWeapon(e.target.value, 'left');
        });

        document.getElementById('skin-select').addEventListener('change', (e) => {
            changeSkin(e.target.value);
        });

        // Slider setup
        function setupSlider(id, valId, updateFn) {
            const slider = document.getElementById(id);
            const valDisplay = document.getElementById(valId);
            slider.addEventListener('input', () => {
                valDisplay.textContent = slider.value;
                updateFn(parseFloat(slider.value));
            });
        }

        setupSlider('right-x', 'right-x-val', (v) => { if (rightProp) rightProp.position.x = v; });
        setupSlider('right-y', 'right-y-val', (v) => { if (rightProp) rightProp.position.y = v; });
        setupSlider('right-z', 'right-z-val', (v) => { if (rightProp) rightProp.position.z = v; });
        setupSlider('left-x', 'left-x-val', (v) => { if (leftProp) leftProp.position.x = v; });
        setupSlider('left-y', 'left-y-val', (v) => { if (leftProp) leftProp.position.y = v; });
        setupSlider('left-z', 'left-z-val', (v) => { if (leftProp) leftProp.position.z = v; });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
