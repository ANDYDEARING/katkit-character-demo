<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KayKit Character Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h1>Knight</h1>
        <p>Drag to rotate | Scroll to zoom</p>
        <div id="props-status" style="margin-top: 10px; font-size: 12px;">
            <div>Right hand: <span id="right-prop">loading...</span></div>
            <div>Left hand: <span id="left-prop">loading...</span></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 1.5, 3);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // Ground plane
        const groundGeometry = new THREE.CircleGeometry(2, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a4e,
            roughness: 0.8
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper
        const gridHelper = new THREE.GridHelper(4, 20, 0x444466, 0x333355);
        scene.add(gridHelper);

        // Asset paths
        const loader = new GLTFLoader();
        const basePath = 'kaykit-assets/KayKit Adventurers 2.0';
        const modelPath = `${basePath}/Characters/gltf/Knight.glb`;
        const swordPath = `${basePath}/Assets/gltf/sword_1handed.gltf`;
        const shieldPath = `${basePath}/Assets/gltf/shield_round.gltf`;

        // Store references for props attachment
        let rightHandBone = null;
        let leftHandBone = null;

        // Helper to log skeleton hierarchy
        function logSkeleton(object, indent = '') {
            console.log(indent + object.name + ' (' + object.type + ')');
            for (const child of object.children) {
                logSkeleton(child, indent + '  ');
            }
        }

        // Load props and attach to hands
        function attachProp(propPath, bone, propName, statusElementId, offset = {x: 0, y: 0, z: 0}, rotation = {x: 0, y: 0, z: 0}, scale = 1) {
            const statusEl = document.getElementById(statusElementId);

            loader.load(propPath, (gltf) => {
                const prop = gltf.scene;
                prop.position.set(offset.x, offset.y, offset.z);
                prop.rotation.set(rotation.x, rotation.y, rotation.z);
                prop.scale.setScalar(scale);

                prop.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                bone.add(prop);
                console.log(`Attached ${propName} to ${bone.name}`);
                if (statusEl) statusEl.textContent = propName;
            }, undefined, (error) => {
                console.error(`Failed to load ${propName}:`, error);
                if (statusEl) statusEl.textContent = 'failed to load';
            });
        }

        // Load the Knight model
        loader.load(
            modelPath,
            (gltf) => {
                const model = gltf.scene;

                // Log full skeleton structure to find bone names
                console.log('=== Model Hierarchy ===');
                logSkeleton(model);

                // Enable shadows and find hand bones
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }

                    // Look for hand bones (common naming patterns)
                    const name = child.name.toLowerCase();
                    if (name.includes('hand') || name.includes('wrist') || name.includes('palm')) {
                        console.log('Found potential hand bone:', child.name);
                    }

                    // KayKit uses handslotl and handslotr for prop attachment
                    if (child.name === 'handslotr') {
                        rightHandBone = child;
                        console.log('Right hand slot found:', child.name);
                    }
                    if (child.name === 'handslotl') {
                        leftHandBone = child;
                        console.log('Left hand slot found:', child.name);
                    }
                });

                scene.add(model);
                console.log('Knight model loaded successfully!');

                // After model loads, attach props if bones were found
                if (rightHandBone) {
                    // Sword in right hand
                    attachProp(swordPath, rightHandBone, 'Sword', 'right-prop',
                        {x: 0, y: 0, z: 0},     // offset
                        {x: 0, y: 0, z: 0},     // rotation
                        1                        // scale
                    );
                } else {
                    document.getElementById('right-prop').textContent = 'no bone found';
                }

                if (leftHandBone) {
                    // Shield in left hand
                    attachProp(shieldPath, leftHandBone, 'Shield', 'left-prop',
                        {x: 0, y: 0, z: 0},     // offset
                        {x: 0, y: 0, z: 0},     // rotation
                        1                        // scale
                    );
                } else {
                    document.getElementById('left-prop').textContent = 'no bone found';
                }
            },
            (progress) => {
                console.log('Loading...', (progress.loaded / progress.total * 100).toFixed(1) + '%');
            },
            (error) => {
                console.error('Error loading model:', error);
            }
        );

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
